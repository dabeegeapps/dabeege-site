<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dabeege.apps</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #fafafa;
    --fg: #1a1a1a;
    --fg-muted: rgba(26,26,26,0.65);
    --card-bg: #fff;
    --card-border: #e4e4e4;
    --badge-bg: #f0f0f0;
    --badge-fg: rgba(26,26,26,0.55);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111;
      --fg: #f2f2f2;
      --fg-muted: rgba(242,242,242,0.65);
      --card-bg: #1a1a1a;
      --card-border: #2c2c2c;
      --badge-bg: #262626;
      --badge-fg: rgba(242,242,242,0.55);
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--fg);
  }
  header {
    text-align: center;
    padding: 64px 24px 32px;
  }
  header h1 {
    margin: 0 0 8px;
    font-size: 2rem;
    letter-spacing: -0.02em;
  }
  header p {
    margin: 0;
    color: var(--fg-muted);
  }
  main {
    max-width: 760px;
    margin: 0 auto;
    padding: 24px 24px 80px;
    display: grid;
    gap: 24px;
    grid-template-columns: 1fr;
  }
  @media (min-width: 640px) {
    main { grid-template-columns: 1fr 1fr; }
  }
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 20px;
    padding: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 14px;
  }
  .icon {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    object-fit: cover;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .icon-placeholder {
    width: 96px;
    height: 96px;
    border-radius: 22px;
    background: #3d7b5c;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 2.6rem;
    font-weight: 600;
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }
  .card h2 {
    margin: 4px 0 0;
    font-size: 1.3rem;
  }
  .card .tagline {
    margin: 0;
    color: var(--fg-muted);
    font-size: 0.95rem;
  }
  .cta-row {
    display: flex;
    flex-direction: column;
    gap: 10px;
    width: 100%;
    margin-top: 6px;
  }
  .btn {
    display: block;
    text-decoration: none;
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.95rem;
    font-weight: 600;
  }
  .btn-primary {
    background: var(--fg);
    color: var(--bg);
  }
  .btn-primary:hover { opacity: 0.85; }
  .badge {
    border-radius: 12px;
    padding: 12px 16px;
    font-size: 0.9rem;
    font-weight: 500;
    background: var(--badge-bg);
    color: var(--badge-fg);
  }
  footer {
    text-align: center;
    padding: 0 24px 48px;
    color: var(--fg-muted);
    font-size: 0.85rem;
  }
</style>
</head>
<body>
<header>
  <h1>dabeege.apps</h1>
  <p>Small apps, built one at a time.</p>
</header>
<main>

  <section class="card">
    <img class="icon" src="/whendil-icon.png" alt="Whendil app icon">
    <h2>WHENDIL</h2>
    <p class="tagline">When Did I Last...</p>
    <div class="cta-row">
      <a class="btn btn-primary" href="https://apps.apple.com/us/app/whendil/id6789949420">Download on the App Store</a>
      <span class="badge">Google Play — Coming Soon</span>
    </div>
  </section>

  <section class="card">
    <img class="icon" src="/aislepro-icon.png" alt="AislePro app icon">
    <h2>AislePro</h2>
    <p class="tagline">Grocery lists sorted by aisle.</p>
    <div class="cta-row">
      <span class="badge">In Development</span>
    </div>
  </section>

</main>
<footer>
  &copy; 2026 dabeege.apps
</footer>
</body>
</html>
